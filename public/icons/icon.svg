<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2b78"/>
      <stop offset="1" stop-color="#14121a"/>
    </linearGradient>
    <!-- Bars stop just short of the cross so it stands clear of the sound wave. -->
    <mask id="gap">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="230" y="62" width="52" height="388" rx="26" fill="#000"/>
      <rect x="166" y="162" width="180" height="50" rx="25" fill="#000"/>
    </mask>
  </defs>
  <rect class="bg" width="512" height="512" rx="112" fill="url(#bg)"/>
  <g class="art">
    <g mask="url(#gap)">
      <rect x="186" y="224" width="28" height="188" rx="14" fill="#f6f1e7"/>
      <rect x="298" y="224" width="28" height="188" rx="14" fill="#f6f1e7"/>
      <rect x="138" y="248" width="28" height="140" rx="14" fill="#cfc3ff"/>
      <rect x="346" y="248" width="28" height="140" rx="14" fill="#cfc3ff"/>
      <rect x="90" y="276" width="28" height="84" rx="14" fill="#9d86ff"/>
      <rect x="394" y="276" width="28" height="84" rx="14" fill="#9d86ff"/>
    </g>
    <g fill="#e0b55a">
      <rect x="240" y="72" width="32" height="368" rx="16"/>
      <rect x="176" y="172" width="160" height="30" rx="15"/>
    </g>
  </g>
</svg>
